server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejorar el rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Endpoints de API Backend directos (no colisionan con rutas de la SPA)
    location ~ ^/(toProccess|logout|csrf|api|health|ready) {
        proxy_pass http://toproc-api-prod:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /login: POST va a la API del backend; GET sirve la SPA (React Router)
    location = /login {
        error_page 418 = @backend_login;
        if ($request_method = POST) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @backend_login {
        proxy_pass http://toproc-api-prod:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para Socket.io / WebSocket
    location /socket.io/ {
        proxy_pass http://toproc-api-prod:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Evitar caché en index.html para que siempre cargue la versión más reciente de la SPA
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        # Regla clave para React Router: redirige a index.html si no encuentra el archivo
        try_files $uri $uri/ /index.html;
    }
}
